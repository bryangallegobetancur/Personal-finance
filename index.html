<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6f5f" />
    <meta
      name="description"
      content="Finanzas Personales — Tu panorama financiero, claro."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Finanzas Personales</title>
    <script>
      (function () {
        try {
          var THEMES = ["v3", "v5", "v7", "v10"];
          var stored = localStorage.getItem("fp-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          var theme =
            THEMES.indexOf(stored) !== -1
              ? stored
              : prefersDark
                ? "v7"
                : "v5";
          var root = document.documentElement;
          root.classList.add(theme);
          if (theme === "v7" || theme === "v10") root.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
